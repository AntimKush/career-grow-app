<div class="app-shell" [class.collapsed-mode]="isSidebarCollapsed">
  <!-- Sidebar Navigation -->
  <aside class="app-sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">🚀</span>
      <span class="brand-text" *ngIf="!isSidebarCollapsed">Career Growth App</span>
    </div>
    
    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item" title="Dashboard">
        <i class="icon">📊</i> <span class="label" *ngIf="!isSidebarCollapsed">Dashboard</span>
      </a>
      <a routerLink="/careers" routerLinkActive="active" class="nav-item" title="Careers">
        <i class="icon">💼</i> <span class="label" *ngIf="!isSidebarCollapsed">Careers</span>
      </a>
      <a routerLink="/innovation" routerLinkActive="active" class="nav-item" title="Innovation">
        <i class="icon">💡</i> <span class="label" *ngIf="!isSidebarCollapsed">Innovation</span>
      </a>
      <a routerLink="/mentorship" routerLinkActive="active" class="nav-item" title="Mentorship">
        <i class="icon">🤝</i> <span class="label" *ngIf="!isSidebarCollapsed">Mentorship</span>
      </a>
      <a routerLink="/analytics" routerLinkActive="active" class="nav-item" title="Analytics">
        <i class="icon">📈</i> <span class="label" *ngIf="!isSidebarCollapsed">Analytics</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="app-main-wrapper">
    <!-- Top Header -->
    <header class="app-header">
      <button class="toggle-btn" (click)="toggleSidebar()" aria-label="Toggle Sidebar">
        ☰
      </button>
      <div class="header-search">
        <input type="text" placeholder="Search skills, pathways, ideas..." />
      </div>
      <div class="header-profile">
        <span class="notification-badge" title="Notifications">🔔</span>
        <div class="user-avatar" title="User Profile">JD</div>
      </div>
    </header>

    <!-- Dynamic Page Content (Careers, Innovation, etc., load here) -->
    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
