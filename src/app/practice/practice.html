<form #myForm="ngForm">
  <input type="text" [(ngModel)]="FirstName" name="FirstName" placeholder="First Value" />
  <input type="text" [(ngModel)]="MiddleName" name="MiddleName" placeholder="Middle Value" />
  <input type="text" [(ngModel)]="LastName" name="LastName" placeholder="Last Value" />
  <input type="text" [(ngModel)]="FatherName" name="FatherName" placeholder="Father's Name" />
  <input type="text" [(ngModel)]="DOB" name="DOB" placeholder="DOB" />
  <select [ngModel]="Gender" name="Gender">
    <option>Male</option>
    <option>Female</option>
  </select>
  <input type="radio" [(ngModel)]="Category" value="SC" name="Category">
  <input type="radio" [(ngModel)]="Category"  value="ST" name="Category">
  <input type="radio" [(ngModel)]="Category" value="OBC" name="Category">
  <input type="radio" [(ngModel)]="Category" value="General" name="Category">
</form>
{{myForm.value | json}}
